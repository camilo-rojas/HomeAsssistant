  # =========================================================================
  # Mercado. Direct port of the View Assist stocks view - same root button-card,
  # same absolute-positioned chart panel, same candlestick renderer.
  #
  # The height fix that mattered: the chart field is position:absolute with
  # top/bottom:0 against a position:relative root card whose grid row is 100vh.
  # That is a DEFINITE height. Earlier attempts nested the chart in a
  # layout-card grid cell and asked for height:100%, which resolves to zero -
  # ApexCharts then renders into a zero-height box and shows nothing at all.
  - title: Mercado
    path: mercado
    type: panel
    subview: true
    theme: bedside_black
    cards:
      - type: custom:button-card
        show_icon: false
        show_name: false
        show_state: false
        show_label: false
        tap_action: {action: none}
        triggers_update:
          - sensor.robotray_ohlc
          - sensor.robotray_net_liquidation
          - sensor.robotray_daily_pnl_2
          - sensor.robotray_daily_pnl_percent
          - sensor.robotray_unrealized_pnl
          - sensor.robotray_cash
          - input_boolean.bedside_night_mode
          - sensor.camilo_room
        styles:
          card:
            - background-color: black
            - background-image: none
            - position: relative
            - padding: 0
            - overflow: hidden
            - border: none
            - box-shadow: none
            - border-radius: 0
          grid:
            - grid-template-areas: |
                "stats status"
            - grid-template-columns: 26% 74%
            - grid-template-rows: 100vh
            - row-gap: 0
            - column-gap: 0
          custom_fields:
            stats:
              - display: block
              - width: 100%
              - height: 100%
              - padding: 0
              - box-sizing: border-box
              - background-color: black
              - z-index: 2
            back:
              - position: absolute
              - left: 4px
              - top: 4px
              - z-index: 3
            chart_home:
              - position: absolute
              - left: 26%
              - right: 0
              - top: 0
              - bottom: 0
              - padding: 1.5vh 1vw 0.5vh 0.5vw
              - box-sizing: border-box
              - background-color: black
              - z-index: 1
        custom_fields:
          back:
            card:
              type: custom:mushroom-chips-card
              alignment: start
              chips:
                - type: template
                  icon: mdi:arrow-left
                  content: Volver
                  tap_action:
                    action: navigate
                    navigation_path: /bedside-clock/home
              card_mod:
                style: |
                  ha-card {
                    background: transparent !important;
                    border: none !important;
                    box-shadow: none !important;
                    --chip-height: 32px;
                    --chip-border-radius: 16px;
                    --chip-font-size: 14px;
                    --chip-icon-size: 17px;
                    --chip-background: rgba(255,255,255,0.07);
                  }
          stats: |
            [[[
              const night = states['input_boolean.bedside_night_mode']
                && states['input_boolean.bedside_night_mode'].state === 'on';
              const fg  = night ? '#8B1A1A' : '#FFFFFF';
              const dim = night ? '#5A1010' : 'rgba(255,255,255,0.55)';

              // Same privacy gate as the home market tile.
              const cam = states['sensor.camilo_room'];
              if (!cam || cam.state !== 'Cuarto Principal') return '';

              const num = (id) => {
                const s = states[id];
                if (!s || s.state === 'unknown' || s.state === 'unavailable') return null;
                const v = parseFloat(s.state); return isNaN(v) ? null : v;
              };
              const money = (v) => v === null ? '--'
                : (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('en-US',
                    {minimumFractionDigits:0, maximumFractionDigits:0});

              const netliq = num('sensor.robotray_net_liquidation');
              const cash   = num('sensor.robotray_cash');
              const daily  = num('sensor.robotray_daily_pnl_2');
              const dpct   = num('sensor.robotray_daily_pnl_percent');
              const unrl   = num('sensor.robotray_unrealized_pnl');

              // Same rule as the stocks view: balances carry no sign of their
              // own, so their triangle shows which way the book moved today.
              const tri = (v) => {
                if (v === null || v === 0) return {c:'—', col: dim};
                return v > 0 ? {c:'▲', col: night ? fg : '#2ECC71'}
                             : {c:'▼', col: night ? fg : '#E74C3C'};
              };
              const book = tri(daily);

              const row = (label, value, t) => `
                <div style="display:flex;flex-direction:column;align-items:center;
                            justify-content:center;flex:1 1 0;min-height:0;">
                  <div style="font-size:13px;color:${dim};letter-spacing:0.08em;
                              text-transform:uppercase;white-space:nowrap;">${label}</div>
                  <div style="display:flex;align-items:baseline;margin-top:0.3vh;
                              white-space:nowrap;">
                    <span style="font-size:27px;font-weight:600;color:${fg};">${value}</span>
                    <span style="font-size:19px;color:${t.col};margin-left:8px;">${t.c}</span>
                  </div>
                </div>`;

              const dailyTxt = daily === null ? '--'
                : money(daily) + (dpct === null ? '' : '  ' + (dpct > 0 ? '+' : '') + dpct + '%');

              return `
                <div style="display:flex;flex-direction:column;height:100%;width:100%;
                            box-sizing:border-box;padding:4px 6px;">
                  ${row('Net Liq.',   money(netliq), book)}
                  ${row('Cash',       money(cash),   book)}
                  ${row('Daily P&L',  dailyTxt,      tri(daily))}
                  ${row('Unrealized', money(unrl),   tri(unrl))}
                </div>`;
            ]]]
          chart_home: |
            [[[
              // Privacy gate: no .rr-merc div means the renderer below never
              // finds a target, and the old chart goes away with the old DOM.
              const cam = hass.states['sensor.camilo_room'];
              if (!cam || cam.state !== 'Cuarto Principal') {
                return '<div style="color:rgba(255,255,255,0.35);font-size:15px;'
                  + 'display:flex;align-items:center;justify-content:center;height:100%;">'
                  + 'Portafolio oculto</div>';
              }
              const ENTITY = "sensor.robotray_ohlc";
              const s = hass.states[ENTITY];
              const rows = (s && s.attributes && s.attributes.data) || [];
              const pts = rows
                .filter(d => d.synthetic !== true)
                .filter(d => !(d.open === d.high && d.high === d.low && d.low === d.close))
                .filter(d => { const w = new Date(d.period_start + "T00:00:00").getDay();
                               return w !== 0 && w !== 6; })
                .sort((a, b) => a.period_start < b.period_start ? -1 : 1)
                // A category axis spaces candles evenly, so non-trading days
                // simply are not drawn. With a datetime axis every weekend and
                // holiday leaves a visible gap even though no candle exists.
                // Holidays were already dropped upstream: no trading means
                // open==high==low==close, which the zero-range filter removes.
                .map(d => ({ x: new Date(d.period_start + "T00:00:00")
                                  .toLocaleDateString('es-ES',
                                    { day: 'numeric', month: 'short' }),
                             y: [d.open, d.high, d.low, d.close] }));
              const sig = JSON.stringify(pts);

              // Inline event handlers (onload / onclick) do NOT fire on HTML
              // injected into this dashboard - proven by diagnostic: the field
              // rendered, ApexCharts was present, 17 points were ready, and the
              // <img onload> hook still never ran. Volver failed for the same
              // reason. So the render is scheduled from the template itself and
              // the target div is located by walking shadow roots.
              const findDeep = (root, sel) => {
                if (!root || !root.querySelectorAll) return null;
                const hit = root.querySelector(sel);
                if (hit) return hit;
                for (const el of root.querySelectorAll('*')) {
                  if (el.shadowRoot) { const f = findDeep(el.shadowRoot, sel); if (f) return f; }
                }
                return null;
              };

              setTimeout(function attempt(n) {
                n = n || 0;
                const el = findDeep(document.body, '.rr-merc');
                if (!el) { if (n < 40) setTimeout(() => attempt(n + 1), 100); return; }
                // The template re-runs on every state update; skip if nothing changed.
                if (el.__sig === sig && el.__chart) return;
                el.__sig = sig;
                if (typeof ApexCharts === 'undefined') {
                  el.innerHTML = '<div style="color:#E74C3C;font-size:14px;padding:8px;">'
                    + 'ApexCharts no disponible</div>';
                  return;
                }
                if (!pts.length) {
                  el.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:15px;'
                    + 'display:flex;align-items:center;justify-content:center;height:100%;">'
                    + 'Sin velas todavia</div>';
                  return;
                }
                if (el.__chart) { try { el.__chart.destroy(); } catch (e) {} el.__chart = null; }
                el.__chart = new ApexCharts(el, {
                  chart: { type: "candlestick", height: "100%", background: "transparent",
                           toolbar: { show: false }, zoom: { enabled: false },
                           animations: { enabled: false }, fontFamily: "inherit" },
                  theme: { mode: "dark" },
                  series: [{ name: "Net Liquidation", data: pts }],
                  plotOptions: { candlestick: {
                    colors: { upward: "#22C55E", downward: "#E74C3C" },
                    wick: { useFillColor: true } } },
                  grid: { borderColor: "rgba(255,255,255,0.10)", strokeDashArray: 3,
                          padding: { left: 4, right: 10, top: 6, bottom: 0 } },
                  xaxis: { type: "category",
                           tickAmount: Math.min(8, pts.length),
                           labels: { rotate: 0, hideOverlappingLabels: true,
                             trim: false,
                             style: { colors: "rgba(255,255,255,0.80)", fontSize: "13px" } },
                           axisBorder: { color: "rgba(255,255,255,0.12)" },
                           axisTicks: { color: "rgba(255,255,255,0.12)" } },
                  yaxis: { tooltip: { enabled: true }, forceNiceScale: true,
                           labels: { style: { colors: "rgba(255,255,255,0.80)", fontSize: "13px" },
                             formatter: v => (v === null || v === undefined)
                               ? "" : "$" + (v / 1000).toFixed(0) + "k" } },
                  tooltip: { theme: "dark" }
                });
                el.__chart.render();
              }, 60);

              return '<div class="rr-merc" style="width:100%;height:100%;"></div>';
            ]]]
  # =========================================================================
  # Clima. Uses Home Assistant's built-in weather-forecast card rather than a
  # hand-rolled renderer - it already handles hourly and daily forecasts, and
  # after the inline-handler trouble on this dashboard there is no reason to
  # rebuild what ships natively. met.no reports supported_features=3
  # (daily + hourly), so both panels have real data.
  - title: Clima
    path: clima
    type: panel
    subview: true
    theme: bedside_black
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 50% 50%
          grid-template-rows: 12% 88%
          grid-template-areas: |
            "back back"
            "hourly daily"
          height: 100vh
          margin: 0px
          padding: 4px
          gap: 4px
          background: '#000000'
          align-items: start
        cards:
          - type: custom:mushroom-chips-card
            view_layout: {grid-area: back}
            alignment: start
            chips:
              - type: template
                icon: mdi:arrow-left
                content: Volver
                icon_color: >-
                  {{ 'red' if is_state('input_boolean.bedside_night_mode','on') else 'blue-grey' }}
                tap_action:
                  action: navigate
                  navigation_path: /bedside-clock/home
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important; box-shadow: none !important;
                  --chip-height: 34px;
                  --chip-border-radius: 17px;
                  --chip-font-size: 14px;
                  --chip-icon-size: 18px;
                  {% if is_state('input_boolean.bedside_night_mode','on') %}
                  --chip-background: rgba(139,26,26,0.14);
                  --primary-text-color: #8B1A1A;
                  {% else %}
                  --chip-background: rgba(255,255,255,0.07);
                  --primary-text-color: #FFFFFF;
                  {% endif %}
                }
                mushroom-chips-card {
                  display: flex; align-items: center; justify-content: flex-start;
                  height: 100%; padding-left: 4px;
                }

          # rest of today, hour by hour
          - type: weather-forecast
            view_layout: {grid-area: hourly}
            entity: weather.forecast_home
            forecast_type: hourly
            show_current: true
            show_forecast: true
            card_mod: &wx
              style: |
                ha-card {
                  background: #000000 !important;
                  border: none !important;
                  box-shadow: none !important;
                  padding: 2px 4px !important;
                  display: flex !important;
                  flex-direction: column !important;
                  justify-content: flex-start !important;
                  {% if is_state('input_boolean.bedside_night_mode','on') %}
                  --primary-text-color: #8B1A1A;
                  --secondary-text-color: #5A1010;
                  {% else %}
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: rgba(255,255,255,0.65);
                  {% endif %}
                }
                /* the built-in card is sized for a full-width desktop column;
                   tighten it so a whole forecast fits this 393px viewport */
                ha-card .forecast { padding-top: 2px !important; }
                ha-card .forecast > div { flex: 1 1 0 !important; }
                ha-card .temp { font-size: 15px !important; }
                ha-card .templow { font-size: 13px !important; }
                ha-card .name { font-size: 12px !important; }

          # the days ahead
          - type: weather-forecast
            view_layout: {grid-area: daily}
            entity: weather.forecast_home
            forecast_type: daily
            show_current: false
            show_forecast: true
            card_mod: *wx

  # =========================================================================
  - title: Estudio
    path: estudio
    type: panel
    subview: true
    theme: bedside_black
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-chips-card
            alignment: start
            chips:
              - type: template
                icon: mdi:arrow-left
