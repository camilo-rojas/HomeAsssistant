                icon_color: >-
                  {{ 'red' if is_state('input_boolean.bedside_night_mode','on') else 'blue-grey' }}
                tap_action: {action: navigate, navigation_path: /bedside-clock/home}
              - type: template
                icon: mdi:desk
                content: Estudio
                icon_color: >-
                  {{ 'red' if is_state('input_boolean.bedside_night_mode','on') else 'grey' }}
                tap_action: {action: none}
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important; box-shadow: none !important;
                  --chip-height: 36px; --chip-border-radius: 18px;
                  --chip-font-size: 14px; --chip-icon-size: 18px;
                  {% if is_state('input_boolean.bedside_night_mode','on') %}
                  --chip-background: rgba(139,26,26,0.14);
                  --primary-text-color: #8B1A1A;
                  {% else %}
                  --chip-background: rgba(255,255,255,0.07);
                  --primary-text-color: #FFFFFF;
                  {% endif %}
                }
                .chip-container { justify-content: flex-start !important; }
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.hue_lampara_estudio
                name: Lampara
                card_mod:
                  style: |
                    ha-card {
                      background: #0A0A0A !important;
                      border: none !important; box-shadow: none !important;
                      border-radius: 14px;
                      {% if is_state('input_boolean.bedside_night_mode','on') %}
                      --card-primary-color: #8B1A1A;
                      --card-secondary-color: #5A1010;
                      --primary-text-color: #8B1A1A;
                      --secondary-text-color: #5A1010;
                      {% else %}
                      --card-primary-color: #FFFFFF;
                      --card-secondary-color: rgba(255,255,255,0.60);
                      {% endif %}
                    }
                    ha-card .primary { font-size: 15px !important; }
                    ha-card .secondary { font-size: 12px !important; }
                    ha-card .icon { --mdc-icon-size: 24px !important; }
              - type: custom:mushroom-light-card
                entity: light.switch_luz_estudio
                name: Luz
                card_mod:
                  style: |
