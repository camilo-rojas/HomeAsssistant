# Bedside dashboard - IBM iPhone bedstand (iPhone 15, 852x393 landscape, iOS kiosk).
#
# v5:
#   - light chips pulled up directly under the status row (they were floating
#     mid-column because the row was centring them)
#   - Cuarto is now an icon-only bed chip; Camaras icon-only too
#   - chip font/height reduced so all four lights sit on one line
#   - new "Ben" chip opens the Assist dialog
#   - market block split into its own tappable area -> market subview with the
#     daily performance graph
#
# kiosk_mode requires NemesisRE/kiosk-mode from HACS (the original maykar repo
# was archived in 2022). v14.0.0+ is the build for HA 2026.6 and later. Until it
# is installed this block is simply ignored - it does not break anything.
kiosk_mode:
  hide_header: true
  hide_sidebar: true

views:
  - title: Bedside
    path: home
    type: panel
    theme: bedside_black
    cards:
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: 50% 50%
          grid-template-rows: 15% 15% 15% 15% 16% 24%
          grid-template-areas: |
            "clock persons"
            "clock top"
            "clock lights"
            "weather rooms"
            "market keydate"
            "market media"
          height: 100vh
          margin: 0px
          padding: 0px
          gap: 0px
          background: '#000000'
        cards:
          # ---- LEFT TOP: clock / date / weather -------------------------------
          - type: custom:button-card
            view_layout: {grid-area: clock}
            triggers_update:
              - sensor.time_date
              - weather.forecast_home
              - binary_sensor.tenis_ok
              - input_boolean.bedside_night_mode
            show_icon: false
            show_name: false
            show_state: false
            show_label: false
            tap_action: {action: none}
            styles:
              card:
                - background: '#000000'
                - border: none
                - box-shadow: none
                - border-radius: 0px
                - padding: 0px
                - margin: 0px
              grid:
                - grid-template-areas: '"stack"'
                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
              custom_fields:
                stack: [{width: 100%}, {height: 100%}]
            custom_fields:
              stack: |
                [[[
                  const night = states['input_boolean.bedside_night_mode']
                    && states['input_boolean.bedside_night_mode'].state === 'on';
                  const fg  = night ? '#8B1A1A' : '#FFFFFF';
                  const dim = night ? '#5A1010' : 'rgba(255,255,255,0.62)';
                  const now = new Date();
                  const hh = now.toLocaleTimeString('en-US',
                    { hour: 'numeric', minute: '2-digit', hour12: true });
                  const p = hh.split(' ');
                  let date = now.toLocaleDateString('es-ES',
                    { weekday: 'long', day: 'numeric', month: 'long' });
                  date = date.charAt(0).toUpperCase() + date.slice(1);
                  const ICON = {
                    'clear-night':'weather-night','cloudy':'weather-cloudy',
                    'exceptional':'alert-circle-outline','fog':'weather-fog',
                    'hail':'weather-hail','lightning':'weather-lightning',
                    'lightning-rainy':'weather-lightning-rainy',
                    'partlycloudy':'weather-partly-cloudy','pouring':'weather-pouring',
                    'rainy':'weather-rainy','snowy':'weather-snowy',
                    'snowy-rainy':'weather-snowy-rainy','sunny':'weather-sunny',
                    'windy':'weather-windy','windy-variant':'weather-windy-variant'
                  };
                  const w = states['weather.forecast_home'];
                  const cond = w ? w.state : 'exceptional';
                  const temp = (w && w.attributes.temperature != null)
                    ? Math.round(w.attributes.temperature) : '--';
                  const t = states['binary_sensor.tenis_ok'];
                  const ball = (!night && t && t.state === 'on')
                    ? `<ha-icon icon="mdi:tennis-ball" style="--mdc-icon-size:32px;color:#DFFF4F;margin-left:16px;"></ha-icon>` : '';
                  // Self-ticking clock. This field is only re-rendered when one
                  // of triggers_update changes, i.e. when sensor.time_date
                  // arrives over the websocket - so a dropped connection used
                  // to freeze the digits at the last minute received (seen
                  // 2026-09-19: stuck at 8:59pm while the phone itself was
                  // fine). The interval below rewrites the text from the
                  // browser's own clock every 5s, independent of Home
                  // Assistant, and is registered once per rendered element.
                  const tick = () => {
                    const el = document.querySelector('.rr-clock') ||
                      (function find(root){
                        if (!root || !root.querySelectorAll) return null;
                        const hit = root.querySelector('.rr-clock');
                        if (hit) return hit;
                        for (const e of root.querySelectorAll('*'))
                          if (e.shadowRoot) { const f = find(e.shadowRoot); if (f) return f; }
                        return null;
                      })(document.body);
                    if (!el) return;
                    const d = new Date();
                    const parts = d.toLocaleTimeString('en-US',
                      { hour: 'numeric', minute: '2-digit', hour12: true }).split(' ');
                    const hEl = el.querySelector('.rr-h'), mEl = el.querySelector('.rr-m');
                    if (hEl) hEl.textContent = parts[0];
                    if (mEl) mEl.textContent = (parts[1] || '').toLowerCase();
                    if (!window.__rrClockTimer) {
                      window.__rrClockTimer = setInterval(tick, 5000);
                    }
                  };
                  setTimeout(tick, 50);
                  return `
                    <div class="rr-clock" style="display:flex;flex-direction:column;align-items:flex-start;
                                justify-content:center;width:100%;height:100%;
                                box-sizing:border-box;padding:0 6px 0 4px;">
                      <div style="display:flex;align-items:baseline;color:${fg};
                                  line-height:0.92;white-space:nowrap;">
                        <span class="rr-h" style="font-size:122px;font-weight:300;letter-spacing:-4px;">${p[0]}</span>
                        <span class="rr-m" style="font-size:40px;margin-left:12px;">${(p[1]||'').toLowerCase()}</span>
                      </div>
                      <div style="font-size:25px;color:${dim};margin-top:10px;white-space:nowrap;">${date}</div>
                    </div>`;
                ]]]

          # ---- LEFT BOTTOM: market, tappable -> detail view --------------------
          # ---- weather strip: tappable, opens the Clima detail view ----------
          - type: custom:button-card
            view_layout: {grid-area: weather}
            triggers_update:
              - weather.forecast_home
              - binary_sensor.tenis_ok
              - input_boolean.bedside_night_mode
            show_icon: false
            show_name: false
            show_state: false
            show_label: false
            tap_action:
              action: navigate
              navigation_path: /bedside-clock/clima
            styles:
              card:
                - background: '#000000'
                - border: none
                - box-shadow: none
                - border-radius: 0px
                - padding: 0px
              grid:
                - grid-template-areas: '"w"'
                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
                - justify-items: start
                - align-items: center
              custom_fields:
                w: [{width: 100%}, {height: 100%}, {"justify-self": start}]
            custom_fields:
              w: |
                [[[
                  const night = hass.states['input_boolean.bedside_night_mode']
                    && hass.states['input_boolean.bedside_night_mode'].state === 'on';
                  const fg = night ? '#8B1A1A' : '#FFFFFF';
                  // Home Assistant's animated weather icons are inline SVG built
                  // by ha-state-icon from hass + stateObj; they are not served as
                  // files (/static/images/weather/*.svg is 404) and cannot be
                  // referenced from injected HTML. Colouring the mdi equivalents
                  // per condition gets the same read at a glance.
                  const ICON = {
                    'clear-night':['weather-night','#9FB4D0'],
                    'cloudy':['weather-cloudy','#B0BEC5'],
                    'exceptional':['alert-circle-outline','#E74C3C'],
                    'fog':['weather-fog','#B0BEC5'],
                    'hail':['weather-hail','#81D4FA'],
                    'lightning':['weather-lightning','#FFD54F'],
                    'lightning-rainy':['weather-lightning-rainy','#7FB3E8'],
                    'partlycloudy':['weather-partly-cloudy','#CFD8DC'],
                    'pouring':['weather-pouring','#4FA3E3'],
                    'rainy':['weather-rainy','#7FB3E8'],
                    'snowy':['weather-snowy','#E1F5FE'],
                    'snowy-rainy':['weather-snowy-rainy','#B3E5FC'],
                    'sunny':['weather-sunny','#FFC93C'],
                    'windy':['weather-windy','#B0BEC5'],
                    'windy-variant':['weather-windy-variant','#B0BEC5']
                  };
                  const w = hass.states['weather.forecast_home'];
                  const cond = w ? w.state : 'exceptional';
                  const pair = ICON[cond] || ICON['cloudy'];
                  const iconColor = night ? fg : pair[1];
                  const temp = (w && w.attributes.temperature != null)
                    ? Math.round(w.attributes.temperature) : '--';
                  const t = hass.states['binary_sensor.tenis_ok'];
                  const ball = (!night && t && t.state === 'on')
                    ? '<ha-icon icon="mdi:tennis-ball" style="--mdc-icon-size:30px;'
                      + 'color:#DFFF4F;margin-left:16px;"></ha-icon>' : '';
                  // Column flex with align-items:flex-start - identical to the
                  // clock card, which sits hard against the left edge. A row
                  // flex here kept being centred by button-card.
                  return '<div style="display:flex;flex-direction:column;'
                    + 'align-items:flex-start;justify-content:center;'
                    + 'width:100%;height:100%;box-sizing:border-box;'
                    + 'padding:0 6px 0 4px;">'
                    + '<div style="display:flex;align-items:center;color:' + fg + ';'
                    + 'font-size:30px;white-space:nowrap;">'
                    + '<ha-icon icon="mdi:' + pair[0] + '" style="--mdc-icon-size:38px;'
                    + 'margin-right:12px;color:' + iconColor + ';"></ha-icon>'
                    + temp + '&deg;' + ball + '</div></div>';
                ]]]
          # ---- next key date, between the lights and the music ---------------
          # calendar.key_dates already exposes the next upcoming event in its
          # attributes (message / start_time), so no calendar.get_events call is
          # needed - unlike the weather forecast, which does require one.
          - type: custom:mushroom-template-card
            view_layout: {grid-area: keydate}
            entity: calendar.key_dates
            icon: mdi:calendar-heart
            layout: horizontal
            icon_color: >-
              {% if is_state('input_boolean.bedside_night_mode','on') %}red
              {% else %}
                {% set st = state_attr('calendar.key_dates','start_time') %}
                {% if st %}
                  {% set d = (as_datetime(st).date() - now().date()).days %}
                  {{ 'amber' if d <= 1 else ('orange' if d <= 7 else 'blue-grey') }}
                {% else %}grey{% endif %}
              {% endif %}
            primary: >-
              {#- Strip emoji from the event title. They render as a white tofu
                  box on this device and, being colour glyphs, cannot be tinted
                  red for night mode. The allowlist keeps Spanish accents
                  (A-yy covers a e i o u n) and normal punctuation. -#}
              {{ (state_attr('calendar.key_dates','message') or 'Sin eventos')
                 | regex_replace("[^A-Za-zÀ-ÿ0-9 .,:()\\-'&/]", '') | trim }}
            secondary: >-
              {% set st = state_attr('calendar.key_dates','start_time') %}
              {% if st %}
                {% set meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'] %}
                {% set dt = as_datetime(st) %}
                {% set d = (dt.date() - now().date()).days %}
                {{ dt.day }} {{ meses[dt.month - 1] }} ·
                {%- if d < 0 %} pasado
                {%- elif d == 0 %} hoy
                {%- elif d == 1 %} mañana
                {%- else %} en {{ d }} días{% endif %}
              {% else %}—{% endif %}
            tap_action: {action: more-info}
            card_mod:
              style: |
                ha-card {
                  background: #000000 !important;
                  border: none !important;
                  box-shadow: none !important;
                  padding: 0 4px !important;
                  {% if is_state('input_boolean.bedside_night_mode','on') %}
                  --card-primary-color: #8B1A1A;
                  --card-secondary-color: #5A1010;
                  --primary-text-color: #8B1A1A;
                  --secondary-text-color: #5A1010;
                  {% else %}
                  --card-primary-color: #FFFFFF;
                  --card-secondary-color: rgba(255,255,255,0.60);
                  {% endif %}
                }
                ha-card .primary {
                  font-size: 15px !important; font-weight: 500 !important;
                  white-space: nowrap !important; overflow: hidden !important;
                  text-overflow: ellipsis !important;
                }
                ha-card .secondary { font-size: 13px !important; }
                ha-card .icon { --mdc-icon-size: 24px !important; }
                ha-card mushroom-state-item {
                  padding: 2px 0 !important;
                  justify-content: flex-start !important;
                  padding-left: 0 !important;
                  margin-left: 0 !important;
                }

          # ---- Spotify, under the light chips -------------------------------
          - type: custom:mushroom-media-player-card
            view_layout: {grid-area: media}
            entity: media_player.spotify_camilo
            name: Spotify
            icon: mdi:spotify
            use_media_info: true
            use_media_artwork: true
            show_volume_level: false
            media_controls:
              # The valid name is play_pause_stop, not play_pause. Mushroom
              # silently drops unrecognised control names, which is why only
              # previous and next rendered.
              - previous
              - play_pause_stop
              - next
            volume_controls:
              - volume_buttons
            collapsible_controls: false
            fill_container: false
            tap_action: {action: more-info}
            card_mod:
              style: |
                ha-card {
                  background: #000000 !important;
                  border: none !important;
                  box-shadow: none !important;
                  {% if is_state('input_boolean.bedside_night_mode','on') %}
                  --primary-text-color: #8B1A1A;
                  --secondary-text-color: #5A1010;
                  /* the track name and artist are styled by Mushroom's own
                     --card-primary-color / --card-secondary-color, NOT by the
                     generic --primary-text-color. Without these two the media
                     text stayed white in night mode. */
                  --card-primary-color: #8B1A1A;
                  --card-secondary-color: #5A1010;
                  --card-mod-icon-color: #8B1A1A;
                  --control-icon-color: #8B1A1A;
                  {% else %}
                  --primary-text-color: #FFFFFF;
                  --secondary-text-color: rgba(255,255,255,0.60);
                  --card-primary-color: #FFFFFF;
                  --card-secondary-color: rgba(255,255,255,0.60);
                  --card-mod-icon-color: #1DB954;
                  {% endif %}
                }
                ha-card .primary { font-size: 15px !important; }
                ha-card .secondary { font-size: 13px !important; }
                ha-card .icon { --mdc-icon-size: 26px !important; }
                /* with fill_container the controls stretched into two slabs;
                   keep them compact and centred */
                mushroom-media-player-media-control {
                  --control-height: 38px;
                  --control-button-width: 44px;
                  justify-content: flex-start !important;
                }
                /* --spacing is the gap between the state item and the controls.
                   Default plus a 58%-tall cell left a big hole between the
                   track name and the buttons. */
                ha-card {
                  --spacing: 4px;
                  display: flex !important;
                  flex-direction: column !important;
                  justify-content: center !important;
                }
                ha-card mushroom-state-item {
                  margin-bottom: 0 !important;
                  justify-content: flex-start !important;
                }
                {% if is_state('input_boolean.bedside_night_mode','on') %}
                ha-card .primary, ha-card .secondary { color: #8B1A1A !important; }
                ha-card .secondary { color: #5A1010 !important; }
                /* Album artwork is a photo - it cannot be tinted red without
                   looking wrong, so it is hidden outright at night. Mushroom
                   renders it as mushroom-shape-avatar / .picture when
                   use_media_artwork is on; the plain icon shape goes too so no
                   empty circle is left behind. */
                ha-card mushroom-shape-avatar,
                ha-card .picture,
                ha-card mushroom-shape-icon {
                  display: none !important;
                }
                {% endif %}

          # Portfolio is private: the tile renders blank and stops linking to
          # Mercado unless sensor.camilo_room says Cuarto Principal - this
          # screen lives in the bedroom, so anywhere else means someone other
          # than Camilo is looking at it. unknown/unavailable hide it too -
          # fail closed.
          - type: custom:button-card
            view_layout: {grid-area: market}
            triggers_update:
              - sensor.robotray_daily_pnl_2
              - sensor.robotray_net_liquidation
              - input_boolean.bedside_night_mode
              - sensor.camilo_room
            show_icon: false
            show_name: false
            show_state: false
            show_label: false
            tap_action:
              action: navigate
              navigation_path: >-
                [[[ return (states['sensor.camilo_room'] && states['sensor.camilo_room'].state === 'Cuarto Principal')
                      ? '/bedside-clock/mercado' : '/bedside-clock/home'; ]]]
            styles:
              card:
                - background: '#000000'
                - border: none
                - box-shadow: none
                - border-radius: 0px
                - padding: 0px
              grid:
                - grid-template-areas: '"m"'
                - grid-template-columns: 1fr
                - grid-template-rows: 1fr
              custom_fields:
                m: [{width: 100%}, {height: 100%}]
            custom_fields:
              m: |
                [[[
                  const cam = states['sensor.camilo_room'];
                  if (!cam || cam.state !== 'Cuarto Principal') return '';
                  const night = states['input_boolean.bedside_night_mode']
                    && states['input_boolean.bedside_night_mode'].state === 'on';
                  const dim = night ? '#5A1010' : 'rgba(255,255,255,0.62)';
                  const num = (id) => {
                    const s = states[id];
                    if (!s || s.state === 'unknown' || s.state === 'unavailable') return null;
                    const v = parseFloat(s.state); return isNaN(v) ? null : v;
                  };
                  const pnl = num('sensor.robotray_daily_pnl_2');
                  const pct = num('sensor.robotray_daily_pnl_percent');
                  const nl  = num('sensor.robotray_net_liquidation');
                  const money = (v) => v === null ? '--'
                    : v.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
                  const up = pnl !== null && pnl > 0;
                  const col = night ? '#8B1A1A'
                    : (pnl === null || pnl === 0 ? dim : (up ? '#2ECC71' : '#E74C3C'));
                  const arrow = pnl === null || pnl === 0 ? '' : (up ? '▲' : '▼');
                  const txt = pnl === null ? '--'
                    : (up ? '+$' : '-$') + money(Math.abs(pnl))
                      + (pct === null ? '' : '   ' + (pct > 0 ? '+' : '') + pct + '%');
                  return `
                    <div style="display:flex;flex-direction:column;align-items:flex-start;
                                justify-content:flex-start;width:100%;height:100%;
                                box-sizing:border-box;padding:15px 6px 0 4px;">
                      <div style="font-size:34px;font-weight:500;color:${col};white-space:nowrap;">
                        ${arrow} ${txt}</div>
                      <div style="font-size:22px;color:${dim};margin-top:4px;white-space:nowrap;">
                        $${money(nl)}</div>
                    </div>`;
                ]]]

          # ---- people: Camilo + Natalia always, twins only when home ---------
          - type: custom:mushroom-chips-card
            view_layout: {grid-area: persons}
            alignment: start
            chips:
              - type: template
                entity: person.camilo
                picture: >-
                  {{ '' if is_state('input_boolean.bedside_night_mode','on')
                     else state_attr('person.camilo','entity_picture') }}
                icon: mdi:account
                content: Camilo
                icon_color: >-
                  {% if is_state('input_boolean.bedside_night_mode','on') %}red
                  {% elif is_state('person.camilo','home') %}green{% else %}red{% endif %}
                tap_action: {action: more-info}
                # Room goes UNDER the name, inside the same chip. The parent
                # card's card_mod cannot reach in here (each chip is its own
                # shadow root), but a chip carries its own card_mod, which is
                # applied to that chip's root - so this is the only level from
                # which .content is reachable. Rendered as ::after on .content
                # so the name stays the chip's real text.
                card_mod:
                  style: |
                    {% set room = states('sensor.camilo_room') %}
                    {% if is_state('person.camilo','home')
                          and room not in ['unknown','unavailable','not_home','none'] %}
                    .content {
                      display: flex !important;
                      flex-direction: column !important;
                      align-items: flex-start !important;
                      line-height: 1.05 !important;
                    }
                    .content:after {
                      content: "{{ room }}";
                      font-size: 10px;
                      font-weight: 400;
                      opacity: 0.75;
                      white-space: nowrap;
                    }
                    {% endif %}
              - type: template
                entity: person.natalia
                picture: >-
                  {{ '' if is_state('input_boolean.bedside_night_mode','on')
                     else state_attr('person.natalia','entity_picture') }}
                icon: mdi:account
                content: Natalia
                icon_color: >-
                  {% if is_state('input_boolean.bedside_night_mode','on') %}red
                  {% elif is_state('person.natalia','home') %}green{% else %}red{% endif %}
                tap_action: {action: more-info}
              - type: conditional
                conditions:
                  - condition: state
                    entity: person.ana
                    state: home
                chip:
                  type: template
                  entity: person.ana
                  picture: >-
                    {{ '' if is_state('input_boolean.bedside_night_mode','on')
                       else state_attr('person.ana','entity_picture') }}
                  icon: mdi:account
                  content: Ana
                  icon_color: >-
                    {% if is_state('input_boolean.bedside_night_mode','on') %}red
                    {% elif is_state('person.ana','home') %}green{% else %}red{% endif %}
                  tap_action: {action: more-info}
              - type: conditional
                conditions:
                  - condition: state
                    entity: person.ada
                    state: home
                chip:
                  type: template
                  entity: person.ada
                  picture: >-
                    {{ '' if is_state('input_boolean.bedside_night_mode','on')
                       else state_attr('person.ada','entity_picture') }}
                  icon: mdi:account
                  content: Ada
                  icon_color: >-
                    {% if is_state('input_boolean.bedside_night_mode','on') %}red
                    {% elif is_state('person.ada','home') %}green{% else %}red{% endif %}
                  tap_action: {action: more-info}
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important; box-shadow: none !important;
                  --chip-height: 42px;
                  --chip-border-radius: 21px;
                  --chip-font-size: 14px;
                  --chip-icon-size: 19px;
                  --chip-spacing: 5px;
                  {% if is_state('input_boolean.bedside_night_mode','on') %}
                  --chip-background: rgba(139,26,26,0.14);
                  --primary-text-color: #8B1A1A;
                  {% else %}
                  --chip-background: rgba(255,255,255,0.07);
                  --primary-text-color: #FFFFFF;
                  {% endif %}
                }
                .chip-container {
                  flex-wrap: nowrap !important;
                  justify-content: flex-start !important;
                }
                mushroom-chips-card {
                  display: flex; align-items: center; justify-content: flex-start;
                  height: 100%;
                }

                /* Per-chip name colour. Mushroom has no per-chip text colour
                   option, so this targets position in .chip-container.
                   Camilo and Natalia are always children 1 and 2. Ana and Ada
                   are conditional and only render when home, so anything from
                   child 3 onward is by definition someone who IS home - which
                   is why they can be unconditionally green. */
                .chip-container > *:nth-child(1) {
                  --primary-text-color: {% if is_state('input_boolean.bedside_night_mode','on') %}#8B1A1A{% elif is_state('person.camilo','home') %}#2ECC71{% else %}#E74C3C{% endif %} !important;
                }
                .chip-container > *:nth-child(2) {
                  --primary-text-color: {% if is_state('input_boolean.bedside_night_mode','on') %}#8B1A1A{% elif is_state('person.natalia','home') %}#2ECC71{% else %}#E74C3C{% endif %} !important;
                }
                .chip-container > *:nth-child(n+3) {
                  --primary-text-color: {% if is_state('input_boolean.bedside_night_mode','on') %}#8B1A1A{% else %}#2ECC71{% endif %} !important;
                }
                /* NOTE: hiding the avatar with CSS does not work here. Each chip
                   has its own shadow root, and styles do not pierce nested
                   shadow DOM - .chip-container is as deep as this reaches.
                   The photo is suppressed at source instead: the picture
                   template returns '' at night, so Mushroom falls back to the
                   icon, which can be tinted. */
          # ---- rooms: each chip opens its own detail view --------------------
          - type: custom:mushroom-chips-card
            view_layout: {grid-area: rooms}
            alignment: start
            chips:
