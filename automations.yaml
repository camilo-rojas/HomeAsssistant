- id: '1765940372962'
  alias: 'Presence: Turn on Sala'
  description: >-
    Motion-hold pattern. The old design turned the light on for a fixed 10
    minutes, which failed twice over. The Aeotec sensor stays 'on' for many
    minutes while someone is in the room, so the timer expired while you were
    still there, and because the trigger is an off-to-on edge, walking past
    again produced no state change and could not turn it back on. Now the light
    follows presence and only turns off 10 minutes after motion actually clears.
  triggers:
  - trigger: state
    entity_id: binary_sensor.multisensor6_sala_home_security_motion_detection_2
    to: 'on'
    id: motion_on
  - trigger: state
    entity_id: binary_sensor.multisensor6_sala_home_security_motion_detection_2
    to: 'off'
    for: '00:10:00'
    id: motion_clear
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_on
      - condition: or
        conditions:
        - condition: state
          entity_id: person.camilo
          state: home
        - condition: state
          entity_id: person.natalia
          state: home
      - condition: time
        after: '18:00:00'
        before: '23:00:00'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.dimmable_led_light_bulb
        data: {}
    - conditions:
      - condition: trigger
        id: motion_clear
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.dimmable_led_light_bulb
        data: {}
  mode: queued
  max: 10
- id: '1787284800001'
  alias: Echo5 - Modo Noche ON
  description: After 21:00 put the View Assist clock into night mode (black background,
    dim red text/icons) and drop the screen to minimum brightness.
  triggers:
  - trigger: time
    at: '21:00:00'
  conditions: []
  actions:
  - action: view_assist.set_state
    target:
      entity_id: sensor.echo5
    data:
      mode: night
  - action: switch.turn_off
    target:
      entity_id: switch.vaca_c0e88f32f_auto_brightness
  - action: number.set_value
    target:
      entity_id: number.vaca_c0e88f32f_screen_brightness
    data:
      value: 1
  mode: single
- id: '1787284800002'
  alias: Echo5 - Modo Noche OFF
  description: In the morning return the clock to normal mode and hand brightness
    back to auto.
  triggers:
  - trigger: time
    at: '07:00:00'
  conditions: []
  actions:
  - action: view_assist.set_state
    target:
      entity_id: sensor.echo5
    data:
      mode: normal
  - action: switch.turn_on
    target:
      entity_id: switch.vaca_c0e88f32f_auto_brightness
  mode: single
- id: '1757260000000'
  alias: Bedside - Night mode schedule
  description: >-
    Flips the night-mode boolean at 22:00 and 08:00. Deliberately does NOT touch
    the phone directly - the companion automation below reacts to the boolean,
    so the schedule and the moon/sun button on the dashboard go through exactly
    the same path and cannot disagree.
  triggers:
  - trigger: time
    at: '22:00:00'
    id: night_on
  - trigger: time
    at: '08:00:00'
    id: night_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: night_on
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.bedside_night_mode
    - conditions:
      - condition: trigger
        id: night_off
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.bedside_night_mode
  mode: single
- id: '1757260000001'
  alias: Bedside - Apply kiosk brightness and volume
  description: >-
    Pushes screen brightness and volume to the iPhone whenever night mode
    changes, from either the schedule or the dashboard button.
    NOTE: kiosk commands are ignored while the companion app is backgrounded or
    closed. If the phone was picked up and left on another app, brightness will
    not change until Home Assistant is in the foreground again.
    Brightness 2 is the requested near-dark level; 1 is also valid if 2 is still
    too bright, but 0 may blank the screen entirely.
  triggers:
  - trigger: state
    entity_id: input_boolean.bedside_night_mode
    to: 'on'
    id: to_night
  - trigger: state
    entity_id: input_boolean.bedside_night_mode
    to: 'off'
    id: to_day
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: to_night
      sequence:
      - action: notify.mobile_app_ibm_iphone_bedstand
        data:
          message: kiosk_set_brightness
          data:
            brightness: 2
      - action: notify.mobile_app_ibm_iphone_bedstand
        data:
          message: kiosk_set_volume
          data:
            volume: 15
    - conditions:
      - condition: trigger
        id: to_day
      sequence:
      - action: notify.mobile_app_ibm_iphone_bedstand
        data:
          message: kiosk_set_brightness
          data:
            brightness: 100
      # Daytime volume restore. Without this the phone would stay at 15% all
      # day, since nothing else resets it. Adjust to taste.
      - action: notify.mobile_app_ibm_iphone_bedstand
        data:
          message: kiosk_set_volume
          data:
            volume: 60
  mode: queued
  max: 5
