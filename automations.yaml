- id: '1665710566998'
  alias: Presence - Setup Oficina
  description: >-
    Motion-hold, same pattern as the sala. Between 08.00 and 22.00, when Camilo
    is home and the office is occupied, turns on the perfume; the Hue lamp is
    added only after sunset. Outside that window nothing is switched ON at all,
    so a guest sleeping in the office is never woken by the lamp and controls it
    by hand. Uses the EP-One combined occupancy sensor rather than the raw PIR,
    because PIR alone drops out when you sit still at the desk. The OFF branch is
    deliberately NOT gated - it always runs 10 minutes after occupancy clears, so
    anything switched on just before 22.00 still gets cleaned up instead of being
    stranded on all night.

    2026-08-28: end of window moved 20.00 -> 22.00. The old cutoff meant walking
    in at 21.08 did nothing at all, and it also made the lamp unreachable for
    most of the summer - Miami sunset is 20.14-20.16 in Jun/Jul, i.e. AFTER the
    old cutoff, so "after sunset AND before 20.00" was an empty window from May
    to early August. The lamp's inner check was an OR of (after sunset, before
    sunrise); the sunrise half is dropped because sunrise here is 06.30-07.13
    year round, always before the 08.00 floor, so it could never be true.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ep_one_oficina_occupancy
    to: 'on'
    id: motion_on
  - trigger: state
    entity_id: binary_sensor.ep_one_oficina_occupancy
    to: 'off'
    for: '00:10:00'
    id: motion_clear
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: motion_on
      - condition: state
        entity_id: person.camilo
        state: home
      - condition: time
        after: '08:00:00'
        before: '22:00:00'
      sequence:
      # Perfume runs whenever there is motion in the window, day or night.
      - action: switch.turn_on
        target:
          entity_id: switch.oficina_perfume
        data: {}
      # Lamp only once it is actually dark.
      - if:
        - condition: sun
          after: sunset
        then:
        - action: light.turn_on
          target:
            entity_id: light.hue_lampara_estudio
          data: {}
    - conditions:
      - condition: trigger
        id: motion_clear
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.oficina_perfume
        data: {}
      - action: light.turn_off
        target:
          entity_id: light.hue_lampara_estudio
        data: {}
  mode: queued
  max: 10
