- id: '1558754158891'
  alias: Movimiento Sala
  triggers:
  - entity_id:
    - binary_sensor.multisensor6_sala_home_security_motion_detection_2
    to: 'on'
    from: 'off'
    trigger: state
  conditions:
  - condition: and
    conditions:
    # Camilo is gated on the presence state machine rather than person.camilo,
    # so a short errand (status "Just Left", under 10 min) does not arm the
    # alert and Telegram a snapshot of him walking back in. Natalia has no
    # equivalent state machine yet, so hers stays on person.natalia.
    - condition: state
      entity_id: input_select.camilo_status_options
      state:
      - Away
      - Extended Away
    - condition: state
      entity_id: person.natalia
      state: not_home
  actions:
  - data:
      filename: /config/www/tmp/snapshot.jpg
    target:
      entity_id: camera.sala
    action: camera.snapshot
  - data:
      message: Movimiento en Sala - Comedor
    action: notify.homeacamilorbot
  - data:
      message: Photo
      title: Photo
      data:
        photo:
          file: /config/www/tmp/snapshot.jpg
    action: notify.homeacamilorbot
  mode: single
- id: '1558754413016'
