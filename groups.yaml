presence:
  name: Presence at home
  # Rebuilt 2026-08-28. The previous members could never resolve to on/off, so
  # this group sat at "unknown" permanently and the arrival automation
  # (Luz - Prender todas al llegar @ 16-23h) never fired once:
  #   device_tracker.zte_blade_a3_lite  - entity does not exist (0 states ever)
  #   binary_sensor.natalia_presence    - entity does not exist (0 states ever)
  #   sensor.ana_status / ada_status    - plain sensors holding "Home"/"Away";
  #                                       a sensor's text state is not mappable
  #                                       to on/off, so the group stayed unknown
  # person.* map home -> on and anything else -> off, which is exactly the
  # "is anybody home" semantics the automation wants.
  entities:
    - person.camilo
    - person.natalia
