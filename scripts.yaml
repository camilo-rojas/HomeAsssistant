light_turn_on_cuarto:
  sequence:
  - action: light.toggle
    metadata: {}
    data: {}
    target:
      entity_id:
      - light.cuarto_luz_camilo
      - light.cuarto_luz_nati
      - light.cuarto_lampara
  alias: Light turn on Cuarto
  description: ''
turn_on_sala_set_timer:
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.dimmable_led_light_bulb
    data: {}
  - data: {}
    target:
      entity_id:
      - script.turn_off_sala_after_20_mins
    action: script.turn_on
  alias: Turn on sala set timer
  mode: single
  description: >-
    The explicit script.turn_off that used to precede this was a race.
    script.turn_off cancels asynchronously, so the script.turn_on right after it
    could hit a timer still marked as running and be refused by mode single,
    leaving the timer cancelled but never restarted, so the light stayed on.
    The timer is mode restart now, so calling turn_on alone restarts it cleanly.
turn_off_sala_after_20_mins:
  sequence:
  - delay:
      hours: 0
      minutes: 10
      seconds: 0
      milliseconds: 0
  - action: light.turn_off
    target:
      entity_id: light.dimmable_led_light_bulb
    data: {}
  alias: Turn off sala after 10 mins
  mode: restart
  description: >-
    mode restart so each new motion cleanly cancels and restarts the 10 minute
    countdown. The second, identical light.turn_off step was removed.
