# ---------------------------------------------------------------------------
# RobotRay portfolio (https://rr.camilorojas.co - RobotRay API v2.0.0)
# Talks to the REST API directly. The MCP server is a stdio wrapper around this
# same API and cannot be reached by HA; Assist gets portfolio answers via
# ben_router -> Ben/Hermes, which has its own MCP client.
#
# Schema notes from the API docs:
#   net_liquidation - marked book value, CASH ALREADY INCLUDED. Do not add
#                     total_cash to it. Moves when the market moves.
#   capital         - the broker's own figure (IB NetLiquidation / Plaid
#                     balances.current). Can sit unchanged for days.
#   daily_pnl       - exposed directly here. Do NOT derive it by differencing
#                     /history (the docs call this out explicitly).
#   null            - means "not priceable", never zero.
# ---------------------------------------------------------------------------
rest:
  - resource: !secret robotray_current_url
    scan_interval: 300
    timeout: 20
    sensor:
      - name: RobotRay Net Liquidation
        unique_id: robotray_net_liquidation
        value_template: "{{ value_json.data.net_liquidation | float(0) | round(2) }}"
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
      - name: RobotRay Capital
        unique_id: robotray_capital
        value_template: "{{ value_json.data.capital | float(0) | round(2) }}"
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
      - name: RobotRay Cash
        unique_id: robotray_total_cash
        value_template: "{{ value_json.data.total_cash | float(0) | round(2) }}"
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
      - name: RobotRay Daily PnL
        unique_id: robotray_daily_pnl_api
        value_template: "{{ value_json.data.daily_pnl | float(0) | round(2) }}"
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
      - name: RobotRay Unrealized PnL
        unique_id: robotray_unrealized_pnl
        value_template: "{{ value_json.data.unrealized_pnl | float(0) | round(2) }}"
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
      - name: RobotRay Realized PnL
        unique_id: robotray_realized_pnl
        value_template: "{{ value_json.data.realized_pnl | float(0) | round(2) }}"
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
      # Real holdings only: drops the CASH rows and the trailing TOTAL row
      # (which carries account == "" and exists for spreadsheet use).
      - name: RobotRay Positions
        unique_id: robotray_positions
        value_template: >-
          {{ value_json.data.positions
             | rejectattr('account', 'eq', '')
             | rejectattr('sec_type', 'eq', 'CASH')
             | list | count }}
        json_attributes_path: "$.data"
        json_attributes:
          - positions
          - snapshot_timestamp
          - data_source
  # ---------------------------------------------------------------------------
  # RobotRay OHLC - candlestick source for the stocks view.
  #
  # WEEKLY, not daily, and deliberately so. Of 52 daily periods only 10 are
  # non-synthetic: early July logged ~1 sample/day, and weekends are flat by
  # definition (markets closed, net liquidation does not move). Weekly rolls
  # those up - 8 of 9 weekly periods carry real intraday range.
  # For daily candles instead, change interval=weekly to interval=daily in
  # the robotray_ohlc_url secret.
  #
  # State is the period count (small, stable). The candles ride in the
  # attribute, and this entity is recorder-excluded so the array never
  # reaches the database.
  - resource: !secret robotray_ohlc_url
    scan_interval: 900
    timeout: 20
    sensor:
      - name: RobotRay OHLC
        unique_id: robotray_ohlc
        value_template: "{{ value_json.data | count }}"
        json_attributes:
          - data

# ---------------------------------------------------------------------------
# Bedside dashboard (IBM iPhone bedstand, iOS kiosk mode)
# ---------------------------------------------------------------------------
# Replaces the dead group.cuartoprincipal, whose five members (light.cuarto,
# light.hue_lamp_1..3, binary_sensor.control_cuarto) have not existed for a
# long time - the group sat at "unknown" and could never be toggled.
# A light group (not a legacy group) gives a real light entity, so the
# dashboard gets brightness control and a proper on/off state, not just a
# stale on/off union.
light:
  - platform: group
    name: Cuarto Principal
    unique_id: cuarto_principal
    entities:
      - light.cuarto_lampara
      - light.cuarto_luz_camilo
      - light.cuarto_luz_nati

# Single source of truth for night mode. Both the 22:00/08:00 automation and
# the moon/sun button on the dashboard write this, so the schedule and the
# manual toggle can never disagree about the current state.
input_boolean:
  bedside_night_mode:
    name: Bedside Night Mode
    icon: mdi:moon-waning-crescent

# YAML-mode dashboard so the layout can be version-controlled and edited as a
# file. Still fully standalone - it cannot affect the main or View Assist
# dashboards, which stay in storage mode.
lovelace:
  mode: storage
  dashboards:
    bedside-clock:
      mode: yaml
      filename: bedside.yaml
      title: Bedside
      icon: mdi:bed-clock
      show_in_sidebar: true
      require_admin: false

# Loads themes/ - notably themes/bedside/bedside_black.yaml, used by the
# bedside dashboard. Without this block no theme files are read at all.
frontend:
  themes: !include_dir_merge_named themes
