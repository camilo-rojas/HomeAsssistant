  allowlist_external_dirs:
    - /config
# Customization file
  customize: !include customize.yaml

logger:
  default: warning
  logs:
    homeassistant.components.camera: fatal
    requests.packages.urllib3: critical
    # Voice-pipeline diagnostics dialled back from debug to warning 2026-08-24;
    # debug plus the VACA 3s reconnect loop was filling the journal ~50MB/day.
    homeassistant.components.assist_pipeline: warning
    homeassistant.components.tts: warning
    homeassistant.components.wyoming: warning
    custom_components.vaca: warning
    custom_components.ben_router: warning


# Enables configuration UI
config:
system_health:
# ---------------------------------------------------------------------------
# Replaces the deprecated legacy device_tracker (known_devices.yaml, driven by
# device_tracker.see). Named to land on the SAME entity_ids the legacy ones
# used, so person.ana / person.ada keep working with no re-pointing.
# The presence automations publish to these topics with retain: true, so the
# state survives a Home Assistant restart.
# ---------------------------------------------------------------------------
mqtt:
  device_tracker:
    - name: ana_tracker
      unique_id: mqtt_ana_tracker
      state_topic: "home/presence/ana"
      payload_home: "home"
      payload_not_home: "not_home"
      source_type: router
    - name: ada_tracker
      unique_id: mqtt_ada_tracker
      state_topic: "home/presence/ada"
      payload_home: "home"
      payload_not_home: "not_home"
      source_type: router

recorder:
    purge_keep_days: 10
    auto_purge: true
    commit_interval: 30
    exclude:
        entities:
            # 48 positions x 16 fields, rewritten every 5 min, would bloat
            # MariaDB. Excluding only stops history/statistics being stored -
            # the entity and its attributes stay live and fully usable on
            # dashboards, in templates and in automations.
            - sensor.robotray_positions
            # OHLC candle array - same reasoning, belongs nowhere near the DB.
            - sensor.robotray_ohlc
ios:
mobile_app:
media_source:
default_config:

