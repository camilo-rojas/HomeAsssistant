template:
  - sensor:
      - default_entity_id: sensor.camilo_status
        name: Camilo
        state: "{{ states.input_select.camilo_status_options.state }}"
      - default_entity_id: sensor.ana_status
        name: Ana
        state: "{{ states.input_select.mellizas_status_options.state }}"
      - default_entity_id: sensor.ada_status
        state: '{{ states.input_select.mellizas_status_options.state }}'
        name: 'Ada'
      - default_entity_id: sensor.sensor_count
        name: "Number of sensors"
        state: "{{states.sensor | rejectattr('state', 'eq', 'unavailable') | list | count }}"
      - default_entity_id: sensor.automation_count
        name: "Number of automations"
        state: "{{states.automation | rejectattr('state', 'eq', 'unavailable') | list | count }}"
      - default_entity_id: sensor.script_count
        name: "Number of scripts"
        state: "{{states.script | rejectattr('state', 'eq', 'unavailable') | list | count }}"
      - default_entity_id: sensor.tracker_count
        name: "Number of devices"
        state: "{{states.device_tracker| rejectattr('state', 'eq', 'unavailable') | list | count }}"
      - default_entity_id: sensor.lights_count
        name: "Number of lights"
        state: "{{states.light | rejectattr('state', 'eq', 'unavailable') | list | count }}"
      - default_entity_id: sensor.camera_count
        name: "Number of cameras"
        state: "{{states.camera | rejectattr('state', 'eq', 'unavailable') | list | count }}"
      - default_entity_id: sensor.mes_es
        name: "Mes es"
        state: "{{ ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][now().month-1] }}"
      - default_entity_id: sensor.hoy_es
        name: "Hoy es"
        state: "{{['Lunes','Martes','Miércoles','Jueves','Viernes','Sabado','Domingo'][now().weekday()] }}"
      # --- RobotRay composition (for the stocks graph) ---
      # Derived from the positions attribute on sensor.robotray_positions.
      # That entity is excluded from the recorder (48 rows x 16 fields every
      # 5 min would bloat MariaDB) but these derived sensors are separate
      # entities and ARE recorded, so they build graphable history.
      # The trailing TOTAL row carries account == "" and is filtered out.
      - name: "RobotRay Stocks Value"
        unique_id: robotray_stocks_value
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
        availability: "{{ has_value('sensor.robotray_positions') }}"
        state: >-
          {% set p = state_attr('sensor.robotray_positions','positions') or [] %}
          {{ p | rejectattr('account','eq','')
               | selectattr('sec_type','in',['STK','ETF'])
               | map(attribute='market_value') | map('float', 0) | sum | round(2) }}
      - name: "RobotRay Options Value"
        unique_id: robotray_options_value
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
        availability: "{{ has_value('sensor.robotray_positions') }}"
        state: >-
          {% set p = state_attr('sensor.robotray_positions','positions') or [] %}
          {{ p | rejectattr('account','eq','')
               | selectattr('sec_type','eq','OPT')
               | map(attribute='market_value') | map('float', 0) | sum | round(2) }}
      # Cumulative level for the stacked composition graph:
      #   band 1  0 .............. cash
      #   band 2  cash ........... cash + options   <- this sensor
      #   band 3  cash+options ... net_liquidation  (the remainder is stocks)
      - name: "RobotRay Cash Plus Options"
        unique_id: robotray_cash_plus_options
        unit_of_measurement: USD
        device_class: monetary
        state_class: total
        availability: >-
          {{ has_value('sensor.robotray_cash')
             and has_value('sensor.robotray_options_value') }}
        state: >-
          {{ (states('sensor.robotray_cash') | float(0)
              + states('sensor.robotray_options_value') | float(0)) | round(2) }}
      # --- RobotRay daily P&L percentage ---
      # daily_pnl itself comes straight from the API. Only the percentage is
      # derived, against net_liquidation (market value) - that is the
      # denominator the RobotRay UI uses.
      - name: "RobotRay Daily PnL Percent"
        unique_id: robotray_daily_pnl_percent
        unit_of_measurement: "%"
        state_class: measurement
        # sensor.robotray_daily_pnl is an orphaned template entity left over
        # from the pre-API-v2 config; the live REST sensor landed on ..._2.
        # Fall back so this works whichever one is real.
        availability: >-
          {{ (has_value('sensor.robotray_daily_pnl')
              or has_value('sensor.robotray_daily_pnl_2'))
             and has_value('sensor.robotray_net_liquidation')
             and states('sensor.robotray_net_liquidation') | float(0) != 0 }}
        state: >-
          {% set d = states('sensor.robotray_daily_pnl') if has_value('sensor.robotray_daily_pnl')
                     else states('sensor.robotray_daily_pnl_2') %}
          {% set nl = states('sensor.robotray_net_liquidation') | float(0) %}
          {{ ((d | float(0) / nl) * 100) | round(2) }}
        icon: >-
          {% set d = states('sensor.robotray_daily_pnl') if has_value('sensor.robotray_daily_pnl')
                     else states('sensor.robotray_daily_pnl_2') %}
          {% set v = d | float(0) %}
          {{ 'mdi:trending-up' if v > 0 else ('mdi:trending-down' if v < 0 else 'mdi:trending-neutral') }}

  # --- Tennis-ball indicator for the bedside dashboard ---------------------
  # Shows a tennis ball when it has not rained for 5h and no rain is forecast
  # for the next 5h, i.e. the court is probably dry and staying dry.
  #
  # Met.no dropped the old "forecast" attribute, so the hourly forecast has to
  # be pulled with the weather.get_forecasts service. That needs an action,
  # which state-based templates cannot do - hence a trigger-based template.
  - trigger:
      - trigger: time_pattern
        minutes: "/15"
      - trigger: homeassistant
        event: start
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.forecast_home
        data:
          type: hourly
        response_variable: fc
    sensor:
      - name: "Lluvia proximas 5h"
        unique_id: lluvia_proximas_5h
        unit_of_measurement: mm
        state: >-
          {{ (fc['weather.forecast_home'].forecast[:5]
              | map(attribute='precipitation') | map('float', 0) | sum) | round(2) }}
        attributes:
          condiciones: >-
            {{ fc['weather.forecast_home'].forecast[:5]
               | map(attribute='condition') | list | join(', ') }}

  # Tennis verdict. State-based (not trigger-based) so it re-evaluates whenever
  # either input moves - the history_stats sensor updates on its own schedule.
  - binary_sensor:
      - name: "Tenis OK"
        unique_id: tenis_ok
        icon: >-
          {{ 'mdi:tennis-ball' if is_state('binary_sensor.tenis_ok','on') else 'mdi:weather-rainy' }}
        state: >-
          {{ states('sensor.lluvia_ultimas_5h') | float(99) == 0
             and states('sensor.lluvia_proximas_5h') | float(99) == 0 }}
        availability: >-
          {{ has_value('sensor.lluvia_ultimas_5h') and has_value('sensor.lluvia_proximas_5h') }}

sensor:
  # Hours of rain in the last 5h, used by binary_sensor.tenis_ok.
  # NOTE: this reads the Met.no *reported condition*, not measured rainfall -
  # Met.no has no rain gauge here. It updates roughly hourly, so a short shower
  # between updates can be missed. Good enough for "is the court likely dry",
  # not a substitute for an actual rain sensor.
  - platform: history_stats
    name: Lluvia ultimas 5h
    entity_id: weather.forecast_home
    state:
      - "rainy"
      - "pouring"
      - "lightning-rainy"
      - "hail"
      - "snowy-rainy"
    type: time
    end: "{{ now() }}"
    duration: "05:00:00"
  - platform: history_stats
    name: Thinkpad Ana ON today
    # was device_tracker.desktop_kpque7s - the Dell, now destroyed and gone
    # from the registry, so this sensor had been dead. Ana is on a Thinkpad now.
    entity_id: device_tracker.thinkpad_ana
    state: "home"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Thinkpad Ada ON today
    # Same physical laptop (MAC cc:5e:f8:7c:37:41), just renamed at some point
    # to device_tracker.thinkpadl14 - the old id no longer resolves.
    entity_id: device_tracker.thinkpadl14
    state: "home"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Ninas TV time ON today
    entity_id: device_tracker.amazon_stick_ninas
    state: "home"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0) }}"
    end: "{{ now() }}"
